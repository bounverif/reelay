[project]
name = "reelay"
license = { "file" = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
classifiers = [
  'Development Status :: 4 - Beta',
  'Intended Audience :: Developers',
  'Intended Audience :: Science/Research',
  'Topic :: Scientific/Engineering',
  'Topic :: Scientific/Engineering :: Mathematics',
  'Topic :: Software Development :: Testing',
  'License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)',
  'Programming Language :: Python :: 3',
]
keywords = ["reactive", "automata", "monitoring", "testing", "runtime"]
dynamic = ["version", "description"]

[[project.authors]]
name = "Dogan Ulus"
email = "doganulus@gmail.com"

[project.urls]
Documentation = "https://doganulus.github.io/reelay"

[build-system]
requires = ["py-build-cmake~=0.1.8", "pybind11"]
build-backend = "py_build_cmake.build"

[tool.py-build-cmake.module]
name = "reelay"
directory = "python"

[tool.py-build-cmake.sdist]
include = [
  "README.md",
  "CMakeLists.txt",
  "cmake/reelayConfig.cmake.in",
  "include/*",
  "external/*",
  "src/*",
  "python/*",
  "LICENSE",
]
exclude = []

[tool.py-build-cmake.cmake]
minimum_version = "3.22"
build_type = "Release"
source_path = "."
build_path = "/tmp/reelay/build"
args = ["-Wdev"]
build_args = ["-j"]
build_tool_args = []
install_args = ["--verbose"]
install_components = ["python_modules"]

[tool.py-build-cmake.cmake.options]
"REELAY_BUILD_APPS:BOOL" = "OFF"
"REELAY_BUILD_TESTS:BOOL" = "OFF"
"REELAY_BUILD_PYTHON_BINDINGS:BOOL" = "ON"

[tool.py-build-cmake.linux.cmake] # Linux-specific options
generator = "Ninja"
config = ["Release"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["python/tests"]
cache_dir = "/tmp/reelay/.pytest_cache"

[project.optional-dependencies]
devel = ["pytest"]
